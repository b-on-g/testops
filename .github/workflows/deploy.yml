name: $bog_testops_app

permissions: write-all

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22  # или 20, если ты на нём

      - name: Install mam and pg
        run: |
          npm init -y
          npm install github:hyoo-ru/mam pg @types/pg --omit=dev

      - name: Build $mol app
        run: npx mam build bog/testops app

      - name: Deploy
        if: github.ref == 'refs/heads/master'
        uses: hyoo-ru/gh-deploy@v4.4.1
        with:
          folder: 'bog/testops/app/-'
